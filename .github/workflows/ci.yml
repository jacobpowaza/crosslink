name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run security:check

  secrets:
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret that was committed and then removed is still a
      # secret, so the scan has to see every commit rather than the tip tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path sdks/rust/Cargo.toml
      - run: gradle -p sdks/kotlin test --no-daemon

  swift-protocol:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path sdks/swift
