<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crosslink Chat</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; }
    body {
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      overflow-y: auto;
    }

    /* ── header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .dot.on { background: var(--green); box-shadow: 0 0 8px #4ade8060; }

    /* ── main layout ────────────────────────────────────── */
    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      min-height: calc(100dvh - 100px);
    }

    /* ── pairing card container ─────────────────────────── */
    #pairCardContainer {
      flex-shrink: 0;
    }

    /* ── chat area ──────────────────────────────────────── */
    .chat {
      flex: none;
      display: flex;
      flex-direction: column;
      height: clamp(360px, 58dvh, 640px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .chat-header .pill {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .chat-header .pill.on { color: var(--green); border-color: #16653440; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 200px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
    .msg.web {
      align-self: flex-end;
      background: var(--accent);
      color: #082f49;
      border-bottom-right-radius: 4px;
    }
    .msg.mobile {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }
    .empty-chat {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px;
    }
    .empty-chat.hidden { display: none; }

    /* ── composer ───────────────────────────────────────── */
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--card);
      flex-shrink: 0;
    }
    .composer input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer input::placeholder { color: var(--muted); }
    .composer button {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .composer button:hover { opacity: 0.9; }
    .composer button:disabled { opacity: 0.4; cursor: default; }
    .composer button:active { transform: scale(0.97); }

    /* ── footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* ── responsive ─────────────────────────────────────── */
    @media (max-width: 560px) {
      main { padding: 0 10px; }
      .pair-card { padding: 16px; margin: 12px 0; }
      .qr-wrap svg { width: 150px; height: 150px; }
      .messages { min-height: 150px; padding: 12px; }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Crosslink Chat</h1>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">waiting for mobile</span>
    </div>
  </header>

  <main>
    <!-- canonical pairing widget (CrosslinkConnect) -->
    <div id="pairCardContainer"></div>

    <!-- chat interface -->
    <div class="chat">
      <div class="chat-header">
        <span>Messages</span>
        <span class="pill" id="chatStatus">no device</span>
      </div>
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">No messages yet. Pair your phone to start chatting.</div>
      </div>
      <div class="composer">
        <input id="msgInput" placeholder="Type a message…" autocomplete="off" disabled />
        <button id="sendBtn" onclick="sendMsg()" disabled>Send</button>
      </div>
    </div>
  </main>

  <footer>
    End-to-end encrypted with <a href="https://github.com/jacobpowaza/crosslink" target="_blank" rel="noopener noreferrer">crosslink</a>
  </footer>

  <!-- Served by Crosslink; the demo has no bundler of its own. -->
  <script src="/__crosslink/widget.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    // ── Crosslink pairing card ──────────────────────────
    // One call, and no application metadata: the card talks to the Crosslink
    // control surface the host exposes, so it takes the app's name, icon and
    // colours from the `application` block in server.ts and then mints the
    // pairing session, renders the QR and the 9-digit code, replaces the code
    // before it expires, mints a new one when a device redeems it, applies
    // connection-mode changes, and lists and revokes paired devices. None of
    // that lives in this demo.
    CrosslinkSDK.createPairingCard({
      target: "#pairCardContainer",
      theme: { bg: "#000000" }
    });

    // ── this demo's own chat state ──────────────────────
    const sse = new EventSource("/api/events");
    sse.addEventListener("chat.update", e => {
      const { messages } = JSON.parse(e.data);
      renderMessages(messages);
    });
    sse.addEventListener("status", e => {
      const { mobile } = JSON.parse(e.data);
      $("statusDot").classList.toggle("on", mobile);
      $("statusText").textContent = mobile ? "mobile connected" : "waiting for mobile";
      $("chatStatus").textContent = mobile ? "connected" : "no device";
      $("chatStatus").classList.toggle("on", mobile);
      $("msgInput").disabled = !mobile;
      $("sendBtn").disabled = !mobile;
      if (mobile) $("emptyChat").classList.add("hidden");
    });

    // ── messages ────────────────────────────────────────
    function renderMessages(msgs) {
      const el = $("messages");
      if (msgs.length === 0) return;
      $("emptyChat").classList.add("hidden");

      // only append new messages
      const existing = el.querySelectorAll(".msg").length;
      for (let i = existing; i < msgs.length; i++) {
        const m = msgs[i];
        const div = document.createElement("div");
        div.className = "msg " + (m.sender === "web" ? "web" : "mobile");
        const text = document.createElement("span");
        text.textContent = m.text;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = m.sender + " · " + new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        div.append(text, meta);
        el.appendChild(div);
      }
      el.scrollTop = el.scrollHeight;
    }

    async function sendMsg() {
      const input = $("msgInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      try {
        await fetch("/api/send", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sender: "web", text })
        });
      } catch (err) {
        console.error("send failed:", err);
      }
    }

    $("msgInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });
  </script>
</body>
</html>
