<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crosslink Chat</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .dot.on { background: var(--green); box-shadow: 0 0 8px #4ade8060; }

    /* ── main layout ────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      min-height: 0;
    }

    /* ── pairing card container ─────────────────────────── */
    #pairCardContainer {
      flex-shrink: 0;
    }

    /* ── chat area ──────────────────────────────────────── */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .chat-header .pill {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .chat-header .pill.on { color: var(--green); border-color: #16653440; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 200px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
    .msg.web {
      align-self: flex-end;
      background: var(--accent);
      color: #082f49;
      border-bottom-right-radius: 4px;
    }
    .msg.mobile {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }
    .empty-chat {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px;
    }
    .empty-chat.hidden { display: none; }

    /* ── composer ───────────────────────────────────────── */
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--card);
      flex-shrink: 0;
    }
    .composer input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer input::placeholder { color: var(--muted); }
    .composer button {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .composer button:hover { opacity: 0.9; }
    .composer button:disabled { opacity: 0.4; cursor: default; }
    .composer button:active { transform: scale(0.97); }

    /* ── footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* ── responsive ─────────────────────────────────────── */
    @media (max-width: 560px) {
      main { padding: 0 10px; }
      .pair-card { padding: 16px; margin: 12px 0; }
      .qr-wrap svg { width: 150px; height: 150px; }
      .messages { min-height: 150px; padding: 12px; }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Crosslink Chat</h1>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">waiting for mobile</span>
    </div>
  </header>

  <main>
    <!-- revocation controls (final integration test) -->
    <div style="margin: 12px 0; padding: 12px; border-radius: 10px; background: #1e293b; border: 1px solid #334155;">
      <strong style="font-size: 12px; color: var(--text);">Revocation test</strong>
      <p style="font-size: 11px; color: var(--muted); margin: 4px 0 8px;">Revoke a paired device; mobile must fall back to pairing.</p>
      <button onclick="revokeDevice()" style="font-size: 11px; padding: 6px 14px; border-radius: 999px; border: none; background: #f87171; color: #fff; cursor: pointer; font-weight: 600;">Revoke paired device</button>
      <span id="revokeMsg" style="font-size: 11px; margin-left: 8px; color: var(--muted);"></span>
    </div>

    <!-- canonical pairing widget (CrosslinkConnect) -->
    <div id="pairCardContainer"></div>

    <!-- chat interface -->
    <div class="chat">
      <div class="chat-header">
        <span>Messages</span>
        <span class="pill" id="chatStatus">no device</span>
      </div>
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">No messages yet. Pair your phone to start chatting.</div>
      </div>
      <div class="composer">
        <input id="msgInput" placeholder="Type a message…" autocomplete="off" disabled />
        <button id="sendBtn" onclick="sendMsg()" disabled>Send</button>
      </div>
    </div>
  </main>

  <footer>
    End-to-end encrypted with <a href="https://github.com/crosslink" target="_blank">crosslink</a>
  </footer>

  <script src="./bundle.js?v=2.0.0"></script>
  <script>
    const $ = id => document.getElementById(id);
    let mobileConnected = false;
    let currentMode = localStorage.getItem("crosslink.networkMode") || "local";

    async function revokeDevice() {
      try {
        // Call the server revocation endpoint; requires a paired deviceId.
        // The server will revoke the first non-revoked device.
        const res = await fetch("/api/revoke", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ deviceId: "" })
        });
        const data = await res.json();
        const msgEl = $("revokeMsg");
        if (data.ok) {
          msgEl.textContent = "Device revoked. Mobile will require pairing again.";
          msgEl.style.color = "#4ade80";
        } else {
          msgEl.textContent = "Revoke failed: " + (data.error || "no device to revoke");
          msgEl.style.color = "#f87171";
        }
      } catch (err) {
        $("revokeMsg").textContent = "Revoke error: " + String(err);
        $("revokeMsg").style.color = "#f87171";
      }
    }

    // ── pairing card ─────────────────────────────────────
    const pairingCard = CrosslinkSDK.createPairingCard({
      target: "#pairCardContainer",
      appName: "Crosslink Chat",
      blurb: "<strong>Connect your phone</strong> to chat from another device. The link is end-to-end encrypted &mdash; this server and any relay in between only ever see ciphertext.",
      networkMode: currentMode,
      onRefresh: () => generatePair(currentMode),
      onNetworkModeChange: (mode) => {
        currentMode = mode;
        generatePair(mode);
      }
    });

    // ── SSE ─────────────────────────────────────────────
    const sse = new EventSource("/api/events");
    sse.addEventListener("chat.update", e => {
      const { messages } = JSON.parse(e.data);
      renderMessages(messages);
    });
    sse.addEventListener("status", e => {
      const { mobile } = JSON.parse(e.data);
      mobileConnected = mobile;
      $("statusDot").classList.toggle("on", mobile);
      $("statusText").textContent = mobile ? "mobile connected" : "waiting for mobile";
      $("chatStatus").textContent = mobile ? "connected" : "no device";
      $("chatStatus").classList.toggle("on", mobile);
      $("msgInput").disabled = !mobile;
      $("sendBtn").disabled = !mobile;
      if (mobile) $("emptyChat").classList.add("hidden");
    });
    sse.addEventListener("pair.refresh", () => {
      generatePair(currentMode);
    });

    // ── pairing ─────────────────────────────────────────
    async function generatePair(mode) {
      pairingCard.update({ loading: true });
      try {
        const queryMode = mode || currentMode;
        const res = await fetch(`/api/pair?mode=${encodeURIComponent(queryMode)}`);
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        pairingCard.update({
          qr: data.mobileQr,
          code: data.code,
          expiresAt: data.expiresAt ?? (Date.now() + 120_000),
          loading: false
        });

        // codes expire after 2 minutes; fetch a fresh one just before then
        clearTimeout(generatePair._timer);
        generatePair._timer = setTimeout(() => generatePair(currentMode), 105_000);
      } catch (err) {
        let msg = 'Failed to generate pairing QR.<br><code style="font-size:11px">npm run stack</code>';
        try {
          const text = await res.text();
          const parsed = JSON.parse(text);
          if (parsed?.error) msg = `Failed: ${parsed.error}`;
        } catch {}
        pairingCard.update({
          error: msg,
          loading: false
        });
      }
    }
    generatePair(currentMode);

    // ── messages ────────────────────────────────────────
    function renderMessages(msgs) {
      const el = $("messages");
      if (msgs.length === 0) return;
      $("emptyChat").classList.add("hidden");

      // only append new messages
      const existing = el.querySelectorAll(".msg").length;
      for (let i = existing; i < msgs.length; i++) {
        const m = msgs[i];
        const div = document.createElement("div");
        div.className = "msg " + (m.sender === "web" ? "web" : "mobile");
        const text = document.createElement("span");
        text.textContent = m.text;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = m.sender + " · " + new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        div.append(text, meta);
        el.appendChild(div);
      }
      el.scrollTop = el.scrollHeight;
      lastMsgCount = msgs.length;
    }

    async function sendMsg() {
      const input = $("msgInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      try {
        await fetch("/api/send", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sender: "web", text })
        });
      } catch (err) {
        console.error("send failed:", err);
      }
    }

    $("msgInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });
  </script>
</body>
</html>
