<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Crosslink Chat" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <title>Crosslink Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Developer Chat App Container ───────────────────── */
    #chatApp {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
    }

    /* ── header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      padding-top: calc(12px + env(safe-area-inset-top));
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .dot.on { background: var(--green); box-shadow: 0 0 6px #4ade8060; }

    /* ── chat ───────────────────────────────────────────── */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.12s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } }
    .msg.mobile {
      align-self: flex-end;
      background: var(--accent);
      color: #082f49;
      border-bottom-right-radius: 4px;
    }
    .msg.web {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 10px;
      opacity: 0.55;
      margin-top: 3px;
    }
    .empty-chat {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 20px;
      text-align: center;
    }
    .empty-chat.hidden { display: none; }

    /* ── composer ───────────────────────────────────────── */
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--card);
      flex-shrink: 0;
    }
    .composer input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer input::placeholder { color: var(--muted); }
    .composer button {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      min-width: 56px;
    }
    .composer button:disabled { opacity: 0.3; }
    .composer button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <!-- Developer Application Interface (Secured & Mounted by Crosslink) -->
  <div id="chatApp">
    <header>
      <h1>Crosslink Chat</h1>
      <div class="status">
        <button id="resetBtn" onclick="window.CrosslinkSDK.resetDeviceStorage().then(() => location.reload())" style="background:rgba(255,255,255,0.08);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">Reset</button>
        <span class="dot on" id="dot"></span>
        <span id="stateText">Connected</span>
      </div>
    </header>

    <main class="chat">
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">Connected! Send a message below.</div>
      </div>
      <div class="composer">
        <input id="msgInput" placeholder="Type a message…" autocomplete="off" />
        <button id="sendBtn" onclick="sendMsg()">Send</button>
      </div>
    </main>
  </div>

  <script>
    // If an older Crosslink worker is already controlling this iPhone, reload
    // once when the newly-installed worker claims the page so the install flow
    // cannot continue running a stale bootstrap bundle from its old cache.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        const key = "crosslink.sw-reloaded.v2";
        if (!sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, "1");
          location.reload();
        }
      });
    }
  </script>
  <script src="./bundle.js?v=3.0.0"></script>
  <script>
    const $ = id => document.getElementById(id);
    const vibrate = p => { try { navigator.vibrate?.(p); } catch {} };

    let rpc = null;

    // ── Chat logic ──
    function appendMessage(m, skipEmptyCheck) {
      if (!skipEmptyCheck) $("emptyChat")?.classList.add("hidden");
      const el = $("messages");
      const div = document.createElement("div");
      div.className = "msg " + (m.sender === "mobile" ? "mobile" : "web");
      const text = document.createElement("span");
      text.textContent = m.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = m.sender + " · " + new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      div.append(text, meta);
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    async function loadHistory() {
      if (!rpc) return;
      try {
        const res = await rpc.call("chat.history");
        const msgs = res?.messages ?? [];
        for (const m of msgs) appendMessage(m, true);
        if (msgs.length > 0) $("emptyChat")?.classList.add("hidden");
      } catch (e) {
        console.warn("Failed to load history:", e);
      }
    }

    function subscribeToMessages() {
      if (!rpc) return;
      try {
        rpc.subscribe("chat.new_message", (msg) => {
          vibrate(15);
          appendMessage(msg);
        });
      } catch (e) {
        console.warn("Failed to subscribe to messages:", e);
      }
    }

    async function sendMsg() {
      const input = $("msgInput");
      const text = input.value.trim();
      if (!text || !rpc) return;
      input.value = "";
      try {
        await rpc.call("chat.send", { sender: "mobile", text });
      } catch (err) {
        console.error("send failed:", err);
      }
    }

    $("msgInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });

    // ── Single Authoritative Crosslink Mobile Bootstrap Lifecycle ──
    const bootstrap = new window.CrosslinkSDK.CrosslinkMobileBootstrap({
      appId: "com.crosslink.chat",
      appName: "Crosslink Chat",
      capabilities: ["chat.send", "chat.read"],
      clientOptions: {
        dialTimeoutMs: 3000
      },
      offline: {
        appName: "Crosslink Chat",
        icon: "./icon-192.png",
        title: "Crosslink Chat is offline",
        message: "Open Crosslink Chat on your computer to reconnect automatically."
      },
      onboarding: {
        appName: "Crosslink Chat",
        icon: "./icon-192.png"
      },
      onAuthorized: async (connectedRpc) => {
        rpc = connectedRpc;
        // Mount & expose the developer chat app interface
        $("chatApp").style.display = "flex";
        $("dot").className = "dot on";
        $("stateText").textContent = "Connected";
        subscribeToMessages();
        loadHistory();
      },
      onUnauthorized: () => {
        rpc = null;
        // Hide developer chat app interface immediately
        $("chatApp").style.display = "none";
      },
      onStateChange: (state) => {
        if (state === "offline") {
          $("dot").className = "dot";
          $("stateText").textContent = "Offline";
        }
      }
    });

    bootstrap.start().catch((err) => {
      console.error("[Crosslink Chat] Mobile bootstrap start failed:", err);
    });
  </script>
</body>
</html>
