<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crosslink Chat</title>
  <!--
    No manifest link, no apple-mobile-web-app meta, no icons, no service worker
    registration and no SDK bundle: Crosslink injects all of that when it serves
    this page, from the `application` block in src/server.ts. What is left is
    this demo's own UI.
  -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      min-height: 100dvh;
    }

    /* ── Developer Chat App Container ───────────────────── */
    #chatApp {
      display: none;
      flex-direction: column;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* ── header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      padding-top: calc(12px + env(safe-area-inset-top));
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .status button { min-width: 44px; min-height: 44px; touch-action: manipulation; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .dot.on { background: var(--green); box-shadow: 0 0 6px #4ade8060; }

    /* ── chat ───────────────────────────────────────────── */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    .msg {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.12s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } }
    .msg.mobile {
      align-self: flex-end;
      background: var(--accent);
      color: #082f49;
      border-bottom-right-radius: 4px;
    }
    .msg.web {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 10px;
      opacity: 0.55;
      margin-top: 3px;
    }
    .empty-chat {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 20px;
      text-align: center;
    }
    .empty-chat.hidden { display: none; }

    /* ── composer ───────────────────────────────────────── */
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--card);
      flex-shrink: 0;
    }
    .composer input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer input::placeholder { color: var(--muted); }
    .composer button {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      min-width: 56px;
      min-height: 44px;
      touch-action: manipulation;
    }
    .composer button:disabled { opacity: 0.3; }
    .composer button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <!-- Developer Application Interface (Secured & Mounted by Crosslink) -->
  <div id="chatApp">
    <header>
      <h1>Crosslink Chat</h1>
      <div class="status">
        <button id="resetBtn" onclick="crosslink.reset()" style="background:rgba(255,255,255,0.08);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">Reset</button>
        <span class="dot on" id="dot"></span>
        <span id="stateText">Connected</span>
      </div>
    </header>

    <main class="chat">
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">Connected! Send a message below.</div>
      </div>
      <div class="composer">
        <input id="msgInput" placeholder="Type a message…" autocomplete="off" />
        <button id="sendBtn" onclick="sendMsg()">Send</button>
      </div>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const vibrate = p => { try { navigator.vibrate?.(p); } catch {} };

    function appendMessage(m, skipEmptyCheck) {
      if (!skipEmptyCheck) $("emptyChat")?.classList.add("hidden");
      const el = $("messages");
      const div = document.createElement("div");
      div.className = "msg " + (m.sender === "mobile" ? "mobile" : "web");
      const text = document.createElement("span");
      text.textContent = m.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = m.sender + " · " + new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      div.append(text, meta);
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    let rpc = null;

    async function sendMsg() {
      const input = $("msgInput");
      const text = input.value.trim();
      if (!text || !rpc) return;
      input.value = "";
      try {
        await rpc.call("chat.send", { sender: "mobile", text });
      } catch (err) {
        console.error("send failed:", err);
      }
    }

    $("msgInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });

    // Crosslink hands over here, once this device is paired and trusted. The
    // pairing screen, the Add to Home Screen screen, the offline screen and the
    // reconnect loop have all already happened; this callback runs again by
    // itself after every reconnect.
    crosslink.onConnected(async (connected) => {
      rpc = connected;
      $("chatApp").style.display = "flex";
      $("dot").className = "dot on";
      $("stateText").textContent = "Connected";
      rpc.subscribe("chat.new_message", (msg) => {
        vibrate(15);
        appendMessage(msg);
      });
      const history = await rpc.call("chat.history").catch(() => ({ messages: [] }));
      for (const m of history?.messages ?? []) appendMessage(m, true);
      if ((history?.messages ?? []).length > 0) $("emptyChat")?.classList.add("hidden");
    });

    crosslink.onDisconnected(() => {
      rpc = null;
      $("chatApp").style.display = "none";
    });
  </script>
</body>
</html>
